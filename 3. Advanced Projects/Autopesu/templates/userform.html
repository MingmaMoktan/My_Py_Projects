{% include 'header.html' %}
{% load static %}

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="customerName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="customerName" name="customerName" placeholder="Enter your name" required>
    </div>
    <div class="mb-3">
        <label for="customerPhone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="customerPhone" name="customerPhone" placeholder="Enter your phone number" required>
    </div>
    <div class="mb-3">
        <label for="customerEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="customerEmail" name="customerEmail" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
        <label for="carModel" class="form-label">Car Model</label>
        <input type="text" class="form-control" id="carModel" name="carModel" placeholder="e.g., Toyota Corolla" required>
    </div>
    <div class="mb-3">
        <label for="serviceType" class="form-label">Service Type</label>
        <select class="form-select" id="serviceType" name="serviceType" required>
            <option value="">Choose...</option>
            <option>Exterior Wash</option>
            <option>Interior Cleaning</option>
            <option>Full Wash</option>
            <option>Wax & Polish</option>
            <option>Detailing</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="bookingDate" class="form-label">Preferred Date</label>
        <input type="date" class="form-control" id="bookingDate" name="bookingDate" required>
    </div>
    <div class="mb-3">
        <label for="bookingTime" class="form-label">Preferred Time</label>
        <input type="time" class="form-control" id="bookingTime" name="bookingTime" required>
    </div>
    <div class="mb-3">
        <label for="additionalNotes" class="form-label">Additional Notes</label>
        <textarea class="form-control" id="additionalNotes" name="additionalNotes" rows="3" placeholder="Any special requests?"></textarea>
    </div>
    <button type="submit" class="btn btn-primary w-100">Book Now</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

{% include 'footer.html' %}
